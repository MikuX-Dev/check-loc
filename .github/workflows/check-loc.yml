name: Check sqlc LOC

on:
  workflow_dispatch:
  push:
    branches: main

jobs:
  count-loc:
    runs-on: ubuntu-latest
    steps:
      - name: Install cloc
        run: sudo apt-get update && sudo apt-get install -y cloc

      - name: Get Latest Forgejo Tag
        id: get_tag
        run: |
          TAG=$(git ls-remote --tags --sort="v:refname" https://github.com/sqlc-dev/sqlc | tail -n1 | sed 's/.*\///' | sed 's/\^{}//')
          echo "latest_tag=$TAG" >> $GITHUB_OUTPUT

      - name: Clone Latest Tag
        run: |
          git clone --branch ${{ steps.get_tag.outputs.latest_tag }} https://github.com/sqlc-dev/sqlc forgejo

      - name: LOC for Entire Repo
        run: |
          cd forgejo
          echo "=== LOC: Entire Repository ==="
          cloc . --exclude-dir=.git,tmp,log --not-match-f='.*\.spec\.js'

