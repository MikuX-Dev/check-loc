name: Check GitLab CE LOC

on:
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab
  push:
   branches: main

jobs:
  count-loc:
    runs-on: ubuntu-latest
    steps:
      - name: Install cloc
        run: sudo apt-get update && sudo apt-get install -y cloc

      - name: Get Latest GitLab CE Tag
        id: get_tag
        run: |
          # Fetch only the tags from the remote Forgejo repository
          TAG=$(git ls-remote --tags --sort="v:refname" https://codeberg.org/forgejo/forgejo | tail -n1 | sed 's/.*\///' | sed 's/\^{}//')
          echo "latest_tag=$TAG" >> $GITHUB_OUTPUT
          echo "Latest tag found: $TAG"

      - name: Clone Latest Tag
        run: |
          # Clone only the specific latest tag to minimize download size
          git clone --branch ${{ steps.get_tag.outputs.latest_tag }} https://codeberg.org/forgejo/forgejo forgejo 

      - name: Run cloc on Repository
        run: |
          cd forgejo 
          # Run cloc to count lines of code, excluding common non-code files
          cloc . --exclude-dir=.git,tmp,log --not-match-f='.*\.spec\.js'
