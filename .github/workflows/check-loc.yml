name: Check GitLab CE Latest Tag LOC

on:
  workflow_dispatch: # Allows manual trigger
  push:
   branches: main

jobs:
  check-loc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitLab FOSS (CE) latest tag
        uses: actions/checkout@v4
        with:
          repository: 'gitlab-org/gitlab-foss'
          ref: v18.8.0-rc44
          path: 'gitlab-ce-source'

      - name: Count Lines of Code (cloc)
        uses: djdefi/cloc-action@7
        with:
          options: --exclude-dir=.git,tmp,log --not-match-f='.*\.spec\.js'
          directory: 'gitlab-ce-source'

      - name: Upload LOC Report
        uses: actions/upload-artifact@v4
        with:
          name: gitlab-ce-loc-report
          path: cloc_report.txt # cloc-action typically outputs to stdout; use redirection if needed
